# Builds the Chat Club desktop app (desktop/) for Windows and Mac and puts the
# installers on a GitHub release. Runs when a tag like desktop-v1.2.3 is pushed
# (the version in desktop/package.json should match). The app's own "new
# version" check looks at these releases.
name: Desktop app

on:
  push:
    tags: ['desktop-v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run dist
      - name: Put the installers on the release
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Chat Club ${TAG#desktop-v}" --notes "Chat Club for Windows and Mac. Windows: run Chat-Club-Setup.exe. Mac: open the .dmg (arm64 for Apple silicon, x64 for Intel) and drag Chat Club to Applications." || true
          shopt -s nullglob
          gh release upload "$TAG" dist/*.exe dist/*.dmg --clobber
