# Builds the Chat Club desktop app (desktop/) for Windows and Mac and puts the
# installers on a GitHub release. Runs when a tag like desktop-v1.2.3 is pushed
# (the version in desktop/package.json should match). The app's own "new
# version" check looks at these releases.
name: Desktop app

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # (each step's last lines are repeated as an error note when it fails, so
      # what went wrong shows on the run's page without opening the log)
      - name: Build the installer
        run: |
          set +e +o pipefail
          npm run dist 2>&1 | tee step.log
          test "${PIPESTATUS[0]}" -eq 0 || { echo "::error::$(tail -c 1800 step.log | paste -sd ' ' -)"; exit 1; }
      - name: Put the installers on the release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set +e +o pipefail
          shopt -s nullglob
          {
            gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Chat Club ${TAG#desktop-v}" --notes "Chat Club for Windows and Mac. Windows: run Chat-Club-Setup.exe. Mac: open the .dmg (arm64 for Apple silicon, x64 for Intel) and drag Chat Club to Applications." || sleep 10
            ls -la dist
            gh release upload "$TAG" dist/*.exe dist/*.dmg --clobber
          } 2>&1 | tee step.log
          test "${PIPESTATUS[0]}" -eq 0 || { echo "::error::$(tail -c 1800 step.log | paste -sd ' ' -)"; exit 1; }
      # The Microsoft Store package. Only once the app's identity from Partner
      # Center is in desktop/package.json (build.appx). It is unsigned (the
      # Store signs it), so it is kept as a file on this run, not on the release.
      - name: Build the Microsoft Store package
        if: runner.os == 'Windows'
        id: store
        run: |
          set +e +o pipefail
          if grep -q "FILL-IN-FROM-PARTNER-CENTER" package.json; then echo "no Store identity yet: skipped"; exit 0; fi
          npx electron-builder --win appx --publish never 2>&1 | tee step.log
          test "${PIPESTATUS[0]}" -eq 0 || { echo "::error::$(tail -c 1800 step.log | paste -sd ' ' -)"; exit 1; }
          echo "built=yes" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.store.outputs.built == 'yes'
        with:
          name: Chat-Club-Store
          path: desktop/dist/Chat-Club-Store.appx
